name: Refresh public SB Engaged events


on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

  push:
    branches: [main]
    paths:
      - 'src/radar/live.py'
      - 'src/radar/scrapers/sbengaged.py'
      - 'scripts/refresh_sbengaged.py'
      - 'portfolio_ui/**'
      - '.github/workflows/sbengaged.yml'


permissions:
  contents: read


concurrency:
  group: sbengaged-public-refresh
  cancel-in-progress: false


jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate feed contract and failure handling
        run: python -m pytest tests/test_sbengaged.py -q
      - name: Refresh public source snapshot and dashboard
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_sbengaged.py --days 14
      - name: Validate publication artifacts
        id: validate
        run: |
          python - <<'PYEOF'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'src')
          from radar.schema import validate_snapshot, validate_status
          p = Path('data/sbengaged-events.json')
          if p.exists():
              data = json.loads(p.read_text(encoding='utf8'))
              problems = validate_snapshot(data)
              if problems:
                  print('REJECTED publication snapshot: ' + '; '.join(problems))
                  sys.exit(1)
              print(f"OK: {len(data.get('events', []))} public-source events")
          else:
              print("No public source snapshot exists; status-only dashboard expected, "
                    "no silent fallback.")
          status = Path('data/sbengaged-status.json')
          if status.exists():
              problems = validate_status(json.loads(status.read_text(encoding='utf8')))
              if problems:
                  print('REJECTED refresh status: ' + '; '.join(problems))
                  sys.exit(1)
          PYEOF
      - name: Commit only generated public artifacts
        if: always() && steps.refresh.outcome != 'skipped' && steps.validate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sbengaged-events.json data/sbengaged-status.json docs/dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public SB Engaged snapshot'
            git fetch origin main
                        if ! git rebase origin/main; then
                                      git checkout --theirs -- data/sbengaged-events.json data/sbengaged-status.json docs/dashboard.html
                                                    git add data/sbengaged-events.json data/sbengaged-status.json docs/dashboard.html
                                                                  GIT_EDITOR=true git rebase --continue
                                                                              fi
            git push
          fi
      - name: Surface a failed source refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Public refresh failed; last good data retained. Inspect data/sbengaged-status.json.'
          exit 1
