[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freefood-radar"
version = "1.0.0"
description = "Free-food finder for Stony Brook students: scrape campus event sources, score free-food mentions with NLP, publish a ranked daily digest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "pandas>=1.5",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "plotly>=5.0",
    "matplotlib>=3.6",
    "pillow>=9.0",
    "icalendar>=6.0,<8",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
